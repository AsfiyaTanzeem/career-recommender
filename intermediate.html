<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Intermediate Roadmap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); min-height: 100vh; padding: 50px; font-family: 'Poppins', sans-serif; transition: 0.5s; }
        .result-card { border-radius: 20px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .header-section { background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white; padding: 40px; text-align: center; border-radius: 20px 20px 0 0; }
        .roadmap-box { background: #fff5f5; padding: 25px; border-radius: 15px; border-left: 10px solid #ff416c; }
    </style>
</head>
<body onclick="changeGradient()">
    <div class="container" style="max-width: 800px;">
        <div class="card result-card">
            <div class="header-section">
                <i data-lucide="pencil" style="width: 50px; height: 50px;"></i>
                <h2 class="mt-2">Intermediate Career Roadmap</h2>
            </div>
            <div class="card-body p-5">
                <h5 class="fw-bold text-muted">Available Subcategories:</h5>
                <ul class="list-group mb-4">
                    <li class="list-group-item">MPC </li>
                    <li class="list-group-item">BIPC </li>
                    <li class="list-group-item">Computer Science </li>
                    <li class="list-group-item">Commerce </li>
                    <li class="list-group-item">Arts </li>
                    <li class="list-group-item">Vocational Studies </li>
                </ul>
                <div class="roadmap-box">
                    <h5 class="text-danger fw-bold">Roadmap:</h5>
                    <p>Focus on foundational subjects to prepare for competitive exams and higher education.</p>
                </div>
                <div class="text-center mt-4">
                  <a href="/choose" class="btn btn-outline-secondary">Back to Selection</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
        function changeGradient() {
            const grads = ['linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%)', 'linear-gradient(135deg, #ee9ca7 0%, #ffdde1 100%)'];
            document.body.style.background = grads[Math.floor(Math.random() * grads.length)];
        }
    </script>
</body>
</html>
