<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Career Recommender | Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .welcome-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 60px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .edu-img {
            width: 200px;
            margin-bottom: 30px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
        }
        .btn-start {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none; color: white; padding: 18px 50px;
            border-radius: 50px; font-weight: bold; font-size: 1.2rem;
            text-decoration: none; display: inline-block; transition: 0.3s;
        }
        .btn-start:hover { transform: scale(1.1); color: white; box-shadow: 0 10px 20px rgba(0,242,254,0.4); }
    </style>
</head>
<body>
    <div class="welcome-container">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135810.png" alt="Education Icon" class="edu-img">
        <h1 class="display-4 fw-bold">Your Career Journey Starts Here</h1>
        <p class="fs-5 opacity-75 mb-4">Discover the perfect roadmap tailored for your education.</p>
        <a href="/choose" class="btn-start">Get Started Now</a>
    </div>
</body>
</html>
