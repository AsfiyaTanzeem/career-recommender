<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Choose Your Level</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1d976c 0%, #93f9b9 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .selection-card {
            background: white;
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        .btn-explore {
            background: #1d976c;
            border: none; color: white; padding: 12px 40px;
            border-radius: 10px; width: 100%; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="selection-card">
        <img src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png" width="80" class="mb-3">
        <h2 class="text-dark fw-bold mb-4">Select Education Level</h2>
        <select id="levelSelect" class="form-select form-select-lg mb-4">
            <option value="">-- Click to Select --</option>
            <option value="10th">10th Standard</option>
            <option value="intermediate">Intermediate</option>
            <option value="degree">Degree</option>
            <option value="diploma">Diploma</option>
            <option value="vocational">Vocational Courses</option>
        </select>
        <button class="btn-explore" onclick="navigate()">Explore Roadmap</button>
        <div class="mt-3">
            <a href="/" class="text-muted text-decoration-none small">← Back to Welcome</a>
        </div>
    </div>

    <script>
        function navigate() {
            const val = document.getElementById('levelSelect').value;
            if(val) window.location.href = "/" + val;
        }
    </script>
</body>
</html>
