<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diploma Roadmap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: linear-gradient(135deg, #fbaf42 0%, #f73131 100%); min-height: 100vh; padding: 50px; font-family: 'Poppins', sans-serif; }
        .result-card { border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: none; }
        .header-section { background: linear-gradient(45deg, #f39c12, #e67e22); color: white; padding: 40px; text-align: center; border-radius: 20px 20px 0 0; }
        .roadmap-box { background: #fff8e1; padding: 25px; border-radius: 15px; border-left: 10px solid #f39c12; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <div class="card result-card">
            <div class="header-section">
                <i data-lucide="layers" style="width: 50px; height: 50px;"></i>
                <h2 class="mt-2">Diploma Career Roadmap</h2>
            </div>
            <div class="card-body p-5">
                <h5 class="fw-bold text-muted">Subcategories:</h5>
                <ul class="list-group mb-4">
                    <li class="list-group-item">Engineering </li>
                    <li class="list-group-item">Fashion Design </li>
                    <li class="list-group-item">Hotel Management </li>
                    <li class="list-group-item">Digital Marketing </li>
                </ul>
                <div class="roadmap-box">
                    <h5 class="text-warning fw-bold">Roadmap:</h5>
                    <p>Master design concepts, textiles, and tailoring techniques for a career in apparel design and fashion merchandising.</p>
                </div>
                <div class="text-center mt-4">
                   <a href="/choose" class="btn btn-warning px-5 fw-bold text-white">Back to Selection</a>
                </div>
            </div>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
