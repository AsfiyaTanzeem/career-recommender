<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vocational Roadmap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: linear-gradient(135deg, #1d976c 0%, #93f9b9 100%); min-height: 100vh; padding: 50px; }
        .result-card { border-radius: 20px; border: none; }
        .header-section { background: #27ae60; color: white; padding: 40px; text-align: center; border-radius: 20px 20px 0 0; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <div class="card result-card">
            <div class="header-section">
                <i data-lucide="tool" style="width: 50px; height: 50px;"></i>
                <h2 class="mt-2">Vocational Training Roadmap</h2>
            </div>
            <div class="card-body p-5">
                <h5 class="fw-bold text-muted">Subcategories:</h5>
                <ul class="list-group mb-4">
                    <li class="list-group-item">Coding Bootcamps </li>
                    <li class="list-group-item">Beauty and Wellness </li>
                    <li class="list-group-item">Culinary Arts </li>
                </ul>
                <div class="alert alert-success">
                    <strong>Roadmap:</strong>
                    <p>Train in makeup, skincare, and spa services for roles in salons, wellness centers, or independent entrepreneurship.</p>
                <div class="text-center mt-4">
                  <a href="/choose" class="btn btn-success w-100">Back to Selection</a>
            </div>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
